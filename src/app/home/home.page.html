<ion-header>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button routerLink="/login" fill="clear">
        <ion-icon slot="icon-only" name="person-outline" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>MovieApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-searchbar
    [(ngModel)]="searchQuery"
    (ionChange)="onSearch($event)"
    placeholder="Search movies"
  ></ion-searchbar>

  <h2>Popular Movies</h2>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
    <ion-button fill="outline" (click)="loadPopularMovies()">Retry</ion-button>
  </div>

  <div *ngIf="isLoading" class="loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!isLoading && !errorMessage">
    <ion-grid>
      <ion-row>
        <ion-col size="6" *ngFor="let movie of movies">
          <ion-card>
            <img
              [src]="imageUrl + movie.poster_path"
              [alt]="movie.title"
            />

            <ion-card-header>
              <ion-card-title>{{ movie.title }}</ion-card-title>
              <ion-card-subtitle>{{ movie.release_date }}</ion-card-subtitle>
            </ion-card-header>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
