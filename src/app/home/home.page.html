<app-header title="MovieApp"></app-header>

<ion-content class="ion-padding">
  <ion-searchbar [(ngModel)]="searchQuery" (ionChange)="onSearch($event)" placeholder="Search movies"></ion-searchbar>

  <h2>Popular Movies</h2>

  @if (errorMessage()) {
  <div class="error-message">
    {{ errorMessage() }}
    <ion-button fill="outline" (click)="loadPopularMovies()">Retry</ion-button>
  </div>
  } @if (isLoading()) {
  <div class="loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>
  } @if (!isLoading() && !errorMessage()) {
  <ion-grid>
    <ion-row>
      @for (movie of movies(); track movie.id) {
      <ion-col size="6">
        <a routerLink="/movie/{{ movie.id }}">
          <ion-card>
            <img
              [src]="movie.poster_path ? imageUrl + movie.poster_path : noImage"
              [alt]="movie.title"
              loading="lazy"
              decoding="async"
            />

            <ion-card-header>
              <ion-card-title>{{ movie.title }}</ion-card-title>
              <ion-card-subtitle>{{ movie.release_date }}</ion-card-subtitle>
            </ion-card-header>
          </ion-card>
        </a>
      </ion-col>
      }
    </ion-row>
  </ion-grid>
  }
</ion-content>
