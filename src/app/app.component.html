<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>MovieApp</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      @if (user(); as currentUser) {
        <div class="menu-user">
          @if (currentUser.photoUrl) {
            <img [src]="currentUser.photoUrl" alt="Profile" />
          } @else {
            <ion-icon name="person-outline"></ion-icon>
          }
          <span>{{ currentUser.displayName }}</span>
        </div>
      }

      <ion-list lines="none">
        <ion-menu-toggle>
          <ion-item button routerLink="/home">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Home</ion-label>
          </ion-item>
          <ion-item button routerLink="/movies">
            <ion-icon slot="start" name="film-outline"></ion-icon>
            <ion-label>Movies</ion-label>
          </ion-item>
          <ion-item button routerLink="/favorites">
            <ion-icon slot="start" name="heart-outline"></ion-icon>
            <ion-label>My Favorites</ion-label>
          </ion-item>
          <ion-item button routerLink="/matches">
            <ion-icon slot="start" name="people-outline"></ion-icon>
            <ion-label>Matches</ion-label>
          </ion-item>
          @if (user()?.isAdmin) {
            <ion-item button routerLink="/admin">
              <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
              <ion-label>Admin</ion-label>
            </ion-item>
          }
        </ion-menu-toggle>
      </ion-list>

      <div class="menu-footer">
        @if (user()) {
          <ion-button expand="block" color="danger" (click)="logout()">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            Logout
          </ion-button>
        } @else {
          <ion-button expand="block" routerLink="/login">
            <ion-icon slot="start" name="log-in-outline"></ion-icon>
            Login
          </ion-button>
        }
      </div>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
